<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" font-family="Inter, -apple-system, 'Segoe UI', sans-serif">
  <rect width="1600" height="920" fill="#f5f3ec"/>
  <text x="80" y="92" font-size="15" font-weight="600" letter-spacing="2.2" fill="#1f5d4c">UX WRITING SYSTEM · THE REWRITE</text>
  <text x="80" y="146" font-family="Fraunces, Georgia, serif" font-size="40" font-weight="600" fill="#1c2620" letter-spacing="-0.5">Same moment, rewritten with a structure</text>
  <text x="300" y="222" font-size="13" font-weight="600" letter-spacing="1.8" fill="#6b756d">BEFORE</text>
  <text x="900" y="222" font-size="13" font-weight="600" letter-spacing="1.8" fill="#1f5d4c">AFTER</text>
  <text font-size="13" font-weight="600" letter-spacing="1.8" fill="#6b756d"><tspan x="80" y="292">ERROR</tspan><tspan x="80" dy="20">MESSAGE</tspan></text>
  <text font-size="13" font-weight="600" letter-spacing="1.8" fill="#6b756d"><tspan x="80" y="572">EMPTY</tspan><tspan x="80" dy="20">STATE</tspan></text>
  <rect x="300" y="252" width="560" height="240" rx="16" fill="#ffffff" stroke="#d6d0bf" stroke-width="2"/>
  <rect x="328" y="284" width="36" height="36" rx="8" fill="#f6e1df"/><text x="346" y="309" font-size="22" font-weight="700" fill="#b3261e" text-anchor="middle">!</text>
  <text x="382" y="309" font-size="20" font-weight="600" fill="#1c2620">Error</text>
  <text x="328" y="362" font-size="18" fill="#3d4a42" font-family="ui-monospace, Menlo, monospace">Error details: email_channel_not_found</text>
  <rect x="328" y="412" width="68" height="44" rx="22" fill="#ffffff" stroke="#d6d0bf" stroke-width="2"/><text x="362" y="440" font-size="17" font-weight="600" fill="#3d4a42" text-anchor="middle">OK</text>
  <rect x="900" y="252" width="620" height="240" rx="16" fill="#ffffff" stroke="#d6d0bf" stroke-width="2"/>
  <text x="928" y="309" font-size="21" font-weight="600" fill="#1c2620">We couldn’t find this email channel</text>
  <text font-size="18" font-weight="400" fill="#3d4a42"><tspan x="928" y="350">It may have been renamed or removed. Check your</tspan><tspan x="928" y="375">channel list and try again.</tspan></text>
  <rect x="928" y="412" width="191" height="44" rx="22" fill="#1f5d4c" stroke="#1f5d4c" stroke-width="2"/><text x="1023" y="440" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Go to channels</text>
  <circle cx="1500" cy="303" r="13" fill="#1f5d4c"/><text x="1500" y="308" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <circle cx="1500" cy="358" r="13" fill="#1f5d4c"/><text x="1500" y="363" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <circle cx="1144.8" cy="434" r="13" fill="#1f5d4c"/><text x="1144.8" y="439" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <rect x="300" y="532" width="560" height="240" rx="16" fill="#ffffff" stroke="#d6d0bf" stroke-width="2"/>
  <text x="580" y="660" font-size="18" fill="#6b756d" text-anchor="middle">No data available</text>
  <rect x="900" y="532" width="620" height="240" rx="16" fill="#ffffff" stroke="#d6d0bf" stroke-width="2"/>
  <rect x="928" y="564" width="44" height="44" rx="10" fill="#ece8dd"/><rect x="940" y="584" width="6" height="14" rx="2" fill="#6b756d"/><rect x="951" y="576" width="6" height="22" rx="2" fill="#6b756d"/><rect x="962" y="589" width="0" height="0"/>
  <text x="992" y="593" font-size="21" font-weight="600" fill="#1c2620">No dashboards yet</text>
  <text font-size="18" font-weight="400" fill="#3d4a42"><tspan x="928" y="642">Dashboards you create will show up here, ready to</tspan><tspan x="928" y="667">share with your team.</tspan></text>
  <rect x="928" y="692" width="232" height="44" rx="22" fill="#1f5d4c" stroke="#1f5d4c" stroke-width="2"/><text x="1044" y="720" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">Create a dashboard</text>
  <circle cx="1500" cy="587" r="13" fill="#1f5d4c"/><text x="1500" y="592" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <circle cx="1500" cy="650" r="13" fill="#1f5d4c"/><text x="1500" y="655" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <circle cx="1185.6" cy="714" r="13" fill="#1f5d4c"/><text x="1185.6" y="719" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <circle cx="313" cy="822" r="13" fill="#1f5d4c"/><text x="313" y="827" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="336" y="828" font-size="17" fill="#3d4a42">What happened</text>
  <circle cx="516.8" cy="822" r="13" fill="#1f5d4c"/><text x="516.8" y="827" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="539.8" y="828" font-size="17" fill="#3d4a42">What you can do about it</text>
  <circle cx="815.2" cy="822" r="13" fill="#1f5d4c"/><text x="815.2" y="827" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="838.2" y="828" font-size="17" fill="#3d4a42">One clear next action</text>
  <text x="80" y="882" font-size="17" fill="#6b756d">Illustrative strings in the style of the rewrite. The message stays constant, only the part that has to change, changes.</text>
</svg>
